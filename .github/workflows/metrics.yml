name: 📊 Generate GitHub Metrics

on:
  # Run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:
  # Run when README is updated
  push:
    branches:
      - main
      - master

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Coding Habits
  # ─────────────────────────────────────────────
  metrics-habits:
    name: 🕐 Coding Habits
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate coding habits metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.habits.svg
          user: Tejeswaar
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          config_timezone: Asia/Kolkata
          config_padding: 0, 8 + 11%

  # ─────────────────────────────────────────────
  # Job 2: Language Breakdown
  # ─────────────────────────────────────────────
  metrics-languages:
    name: 💻 Languages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          user: Tejeswaar
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, makefile, cmake
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 0%
          config_timezone: Asia/Kolkata
          config_padding: 0, 8 + 11%

  # ─────────────────────────────────────────────
  # Job 3: Isometric Calendar
  # ─────────────────────────────────────────────
  metrics-isocalendar:
    name: 📅 Isometric Calendar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          user: Tejeswaar
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kolkata
          config_padding: 0, 8 + 11%

  # ─────────────────────────────────────────────
  # Job 4: Achievements
  # ─────────────────────────────────────────────
  metrics-achievements:
    name: 🏆 Achievements
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate achievements metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          user: Tejeswaar
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_ignored: octonaut
          config_timezone: Asia/Kolkata
          config_padding: 0, 8 + 11%
