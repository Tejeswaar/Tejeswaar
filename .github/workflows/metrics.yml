name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  metrics-header:
    name: Profile Header
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate header metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 3
          retries_delay: 300
          optimize: yes
          filename: metrics.header.svg
          user: Tejeswaar
          base: header, repositories
          plugin_lines: yes
          config_timezone: Asia/Kolkata

  metrics-languages:
    needs: metrics-header
    name: Languages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 3
          retries_delay: 300
          optimize: yes
          filename: metrics.languages.svg
          user: Tejeswaar
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, makefile, cmake
          plugin_languages_limit: 8
          config_timezone: Asia/Kolkata

  metrics-isocalendar-full:
    needs: metrics-languages
    name: Isometric Calendar Full
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate full isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 3
          retries_delay: 300
          optimize: yes
          filename: metrics.isocalendar.full.svg
          user: Tejeswaar
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata

  metrics-isocalendar-half:
    needs: metrics-isocalendar-full
    name: Isometric Calendar Half
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate half isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 3
          retries_delay: 300
          optimize: yes
          filename: metrics.isocalendar.half.svg
          user: Tejeswaar
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kolkata


