name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  metrics-header:
    name: Profile Header
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate header metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 3
          retries_delay: 300
          optimize: yes
          filename: metrics.header.svg
          user: Tejeswaar
          base: header, repositories
          config_timezone: Asia/Kolkata

  metrics-languages:
    name: Languages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 3
          retries_delay: 300
          optimize: yes
          filename: metrics.languages.svg
          user: Tejeswaar
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, makefile, cmake
          plugin_languages_limit: 8
          config_timezone: Asia/Kolkata

  metrics-isocalendar:
    name: Isometric Calendar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          retries: 3
          retries_delay: 300
          optimize: yes
          filename: metrics.isocalendar.svg
          user: Tejeswaar
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kolkata

  metrics-lines:
    name: Lines of Code
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate lines metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.lines.svg
          user: Tejeswaar
          base: ""
          plugin_lines: yes
          config_timezone: Asia/Kolkata
